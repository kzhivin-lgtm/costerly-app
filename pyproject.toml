[project]
name = "costerly-app"
version = "0.0.0"
requires-python = ">=3.13,<3.14"
dependencies = [
    "anthropic==0.111.0",
    "cryptography==49.0.0",
    "huggingface-hub==2.3.0",
    "httpx==0.28.1",
    "openpyxl==3.1.5",
    "pandas==3.0.6",
    "xlrd==2.0.2",
    "pillow==12.2.0",
    "pillow-heif>=0.20,<2",
    "pymupdf==1.28.2",
    "streamlit==1.64.0",
    "supabase==2.31.0",
    "torch==2.11.0",
    "transformers==5.20.2",
]

[tool.uv]
package = false

[[tool.uv.index]]
name = "pytorch-cpu"
url = "https://download.pytorch.org/whl/cpu"
explicit = true

[tool.uv.sources]
torch = { index = "pytorch-cpu" }
