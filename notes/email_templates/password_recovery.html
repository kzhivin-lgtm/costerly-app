<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <title>Reset your Costerly AI password</title>
  </head>
  <body style="margin:0;padding:0;background:#f1efef;color:#2a1f2c;font-family:Arial,Helvetica,sans-serif;">
    <div style="display:none;max-height:0;overflow:hidden;opacity:0;color:transparent;">
      Create a new password for your Costerly AI account.
    </div>
    <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0" style="width:100%;background:#f1efef;">
      <tr>
        <td align="center" style="padding:48px 20px;">
          <table role="presentation" width="560" cellspacing="0" cellpadding="0" border="0" style="width:100%;max-width:560px;background:#ffffff;border:1px solid #e7dfe9;border-radius:20px;">
            <tr>
              <td style="padding:38px 38px 36px;">
                <img
                  src="https://app.costerly.ai/assets/email/costerly-ai-logo.png"
                  width="242"
                  height="46"
                  alt="Costerly AI"
                  style="display:block;width:242px;max-width:100%;height:auto;border:0;margin:0 0 32px;"
                >
                <p style="margin:0 0 28px;font-size:16px;line-height:1.6;color:#2a1f2c;">
                  We received your request. Click the button below to create a new password.
                </p>
                <table role="presentation" width="100%" cellspacing="0" cellpadding="0" border="0">
                  <tr>
                    <td align="center" bgcolor="#8049c6" style="border-radius:11px;">
                      <a
                        href="{{ .ConfirmationURL }}"
                        style="display:block;padding:18px 24px;color:#ffffff;text-decoration:none;font-size:18px;font-weight:700;line-height:1.25;border-radius:11px;"
                      >Reset your password</a>
                    </td>
                  </tr>
                </table>
                <p style="margin:28px 0 0;font-size:14px;line-height:1.5;color:#67616c;">
                  If you didn’t request this, you can safely ignore this email.
                </p>
              </td>
            </tr>
          </table>
        </td>
      </tr>
    </table>
  </body>
</html>
