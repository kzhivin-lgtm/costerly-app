<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>costerly.ai</title>
    <meta name="costerly-wrapper-version" content="v2.01.41-plus-single-grey-boot" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />

    <link rel="icon" type="image/svg+xml" href="/favicon-large.svg?v=2" />
    <link rel="shortcut icon" href="/favicon-large.svg?v=2" />

    <style>
      html,
      body {
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #F1EFEF;
      }

      iframe {
        width: 100vw;
        height: 100vh;
        border: 0;
        display: block;
        background: #F1EFEF;
        opacity: 0;
        transition: opacity 120ms ease;
      }

      iframe.is-ready {
        opacity: 1;
      }

      .app-loading-mask {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #F1EFEF;
        opacity: 1;
        pointer-events: none;
        transition: opacity 160ms ease;
      }

      .app-loading-mask.is-hidden {
        opacity: 0;
      }

      .embed-footer-mask {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 46px;
        background: #F1EFEF;
        z-index: 2;
      }
    </style>
  </head>

  <body>
    <div class="app-loading-mask" id="app-loading-mask" aria-hidden="true"></div>
    <iframe
      id="costerly-app-frame"
      src="https://costerly-app.streamlit.app/?embed=true"
      title="costerly.ai"
      allow="clipboard-write; clipboard-read; fullscreen"
    ></iframe>
    <div class="embed-footer-mask" aria-hidden="true"></div>
    <script>
      (() => {
        const mask = document.getElementById("app-loading-mask");
        const frame = document.getElementById("costerly-app-frame");
        let fallbackTimer = null;
        let ready = false;

        function revealApp() {
          if (ready) return;
          ready = true;
          window.clearTimeout(fallbackTimer);
          if (frame) frame.classList.add("is-ready");
          if (mask) {
            mask.classList.add("is-hidden");
            window.setTimeout(() => mask.remove(), 220);
          }
        }

        window.addEventListener("message", (event) => {
          if (event.data && event.data.type === "costerly:app-ready") {
            revealApp();
          }
        });

        fallbackTimer = window.setTimeout(revealApp, 8000);
      })();
    </script>
  </body>
</html>
