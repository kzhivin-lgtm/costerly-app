<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>costerly.ai</title>
    <meta name="costerly-wrapper-version" content="v3.12.1-r2-price-source-feedback" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://core.costerly.ai" crossorigin />

    <link rel="icon" type="image/svg+xml" href="/favicon-large.svg?v=2" />
    <link rel="shortcut icon" href="/favicon-large.svg?v=2" />

    <style>
      html,
      body {
        color-scheme: light;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #F1EFEF;
      }

      iframe {
        width: 100vw;
        height: 100vh;
        border: 0;
        display: block;
        background: #F1EFEF;
        opacity: 0;
        transition: opacity 120ms ease;
      }

      iframe.is-ready {
        opacity: 1;
      }

      iframe.is-transitioning {
        opacity: 0;
        pointer-events: none;
        transition: none;
      }

      .app-loading-mask {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #F1EFEF;
        opacity: 1;
        pointer-events: none;
        transition: opacity 160ms ease;
      }

      .app-loading-mask.is-hidden {
        opacity: 0;
      }

      .app-loading-mask.is-transitioning {
        opacity: 1;
        transition: none;
      }

      .embed-footer-mask {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 46px;
        background: #F1EFEF;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 500 12px/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .embed-footer-mask a {
        color: #67616C;
        text-decoration: none;
      }

      .embed-footer-mask a:hover,
      .embed-footer-mask a:focus-visible {
        color: #3B2E48;
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="app-loading-mask" id="app-loading-mask" aria-hidden="true"></div>
    <iframe
      id="costerly-app-frame"
      data-src="https://core.costerly.ai/?embed=true"
      title="costerly.ai"
      allow="clipboard-write; clipboard-read; fullscreen"
    ></iframe>
    <div class="embed-footer-mask">
      <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>
    </div>
    <script>
      (() => {
        const BUILD_VERSION = "3.12.1-r2";
        const startedAt = performance.now();
        const traceId = crypto.randomUUID();
        const timeline = [];
        const mask = document.getElementById("app-loading-mask");
        const frame = document.getElementById("costerly-app-frame");
        const backendByHostname = Object.freeze({
          "staging.costerly.ai": "https://core.costerly.ai/?embed=true",
        });
        const selectedBackend = backendByHostname[window.location.hostname];
        if (selectedBackend) frame.dataset.src = selectedBackend;
        const recoveryFragment = new URLSearchParams(window.location.hash.slice(1));
        const recoveryPath =
          /^\/recover\/?$/.test(window.location.pathname) ||
          recoveryFragment.get("type") === "recovery";
        const confirmationPath =
          /^\/confirm\/?$/.test(window.location.pathname) ||
          ["signup", "email"].includes(recoveryFragment.get("type"));
        const pathInvite = window.location.pathname.match(/^\/(?:start|join)\/([A-Za-z0-9_-]{43})\/?$/);
        const workflowPath = window.location.pathname.match(/^\/([reo])\/([A-Za-z0-9_-]{10,32})\/?$/);
        const inviteToken = pathInvite
          ? pathInvite[1]
          : new URLSearchParams(window.location.search).get("invite");
        const startupProbe = new URLSearchParams(window.location.search).get("startup_probe");
        const appUrl = new URL(frame.dataset.src);
        const appOrigin = appUrl.origin;
        const routeKeys = ["screen", "profile_tab", "run_id", "estimate_id", "object_id", "route_token"];
        const allowedProfileTabs = new Set([
          "overhead-expenses",
          "labor-costs",
          "pricing-cost",
          "machinery",
          "contacts",
          "bank-details",
          "company-details",
          "users",
          "price-lists",
        ]);
        const outerParams = new URLSearchParams(window.location.search);
        appUrl.searchParams.set("obs_trace", traceId);
        routeKeys.forEach((key) => {
          const value = outerParams.get(key);
          if (value) appUrl.searchParams.set(key, value);
        });
        if (workflowPath) {
          const pathScreen = {r: "file_review", e: "objects", o: "object_detail"}[workflowPath[1]];
          appUrl.searchParams.set("screen", pathScreen);
          appUrl.searchParams.set("route_token", workflowPath[2]);
        }
        if (inviteToken && /^[A-Za-z0-9_-]{43}$/.test(inviteToken)) {
          appUrl.searchParams.set("invite", inviteToken);
        }
        if (recoveryPath) {
          appUrl.searchParams.set("auth_flow", "recovery");
          appUrl.hash = window.location.hash;
        }
        if (confirmationPath) {
          appUrl.searchParams.set("auth_flow", "confirmation");
          appUrl.hash = window.location.hash;
        }
        if (startupProbe === "anonymous") {
          appUrl.searchParams.set("startup_probe", "anonymous");
        }
        let fallbackTimer = null;
        let internalTransitionTimer = null;
        let iframeLoadAtMs = null;
        let ready = false;
        const readyRunIds = new Set();
        const pendingTransitions = [];
        const expectedScreens = {
          sign_in: ["upload", "account", "company_setup"],
          upload_to_profile: ["account"],
          profile_to_upload: ["upload"],
          upload_to_admin: ["admin"],
          profile_to_admin: ["admin"],
          admin_to_profile: ["account"],
          admin_to_upload: ["upload"],
          profile_to_sign_out: ["login"],
          upload_to_sign_out: ["login"],
        };
        const maskedInternalTransitions = new Set([
          "upload_to_profile",
          "profile_to_upload",
          "upload_to_admin",
          "profile_to_admin",
          "admin_to_profile",
          "admin_to_upload",
          "profile_to_sign_out",
          "upload_to_sign_out",
          "processing_to_file_review",
          "file_review_to_objects",
          "objects_to_file_review",
          "objects_to_object_detail",
          "object_detail_to_objects",
          "object_detail_approve_to_objects",
          "upload_to_projects",
          "profile_to_projects",
          "admin_to_projects",
          "projects_to_upload",
          "projects_to_profile",
          "projects_to_admin",
          "objects_to_projects",
          "back_to_upload",
          "new_estimate",
          "last_estimate",
        ]);
        const startupPhases = new Set([
          "auth_component_script",
          "auth_component_render",
          "auth_storage_read",
          "auth_value_sent",
        ]);

        function mark(eventName, detail = {}) {
          const event = {
            occurred_at: new Date().toISOString(),
            schema_version: "runtime_v1",
            build_version: BUILD_VERSION,
            source: "browser",
            trace_id: traceId,
            event_name: eventName,
            screen: detail.screen || "unknown",
            status: detail.status || "ok",
            elapsed_ms: Math.round((performance.now() - startedAt) * 1000) / 1000,
            metadata: detail.metadata || {},
          };
          if (detail.duration_ms !== undefined) {
            event.duration_ms = Math.round(Number(detail.duration_ms) * 1000) / 1000;
          }
          timeline.push(event);
          performance.mark(`costerly:${eventName}`);
        }

        function navigationMetadata() {
          const navigation = performance.getEntriesByType("navigation")[0];
          if (!navigation) return {};
          return {
            navigation_type: navigation.type,
            ttfb_ms: Math.round(navigation.responseStart * 1000) / 1000,
            response_end_ms: Math.round(navigation.responseEnd * 1000) / 1000,
            dom_interactive_ms: Math.round(navigation.domInteractive * 1000) / 1000,
            dom_content_loaded_ms: Math.round(navigation.domContentLoadedEventEnd * 1000) / 1000,
            load_event_ms: Math.round(navigation.loadEventEnd * 1000) / 1000,
          };
        }

        function safeRouteValue(value) {
          const text = String(value || "");
          return /^[A-Za-z0-9_-]{1,160}$/.test(text) ? text : "";
        }

        function syncOuterRoute(route, renderedScreen) {
          const nextUrl = new URL(window.location.href);
          const currentScreen = safeRouteValue(nextUrl.searchParams.get("screen"));
          const currentProfileTab = safeRouteValue(nextUrl.searchParams.get("profile_tab"));
          routeKeys.forEach((key) => nextUrl.searchParams.delete(key));

          // A workflow path must not survive navigation to Profile, Upload or
          // Admin. It would otherwise be reinterpreted after a browser refresh.
          if (/^\/[reo]\/[A-Za-z0-9_-]{10,32}\/?$/.test(nextUrl.pathname)) {
            nextUrl.pathname = "/";
          }

          const requestedScreen = safeRouteValue(route && route.screen);
          const screen = requestedScreen || safeRouteValue(renderedScreen);
          if (screen === "account") {
            nextUrl.searchParams.set("screen", "account");
            // A Streamlit tab is selected client-side. Its click updates the
            // outer route immediately, but an already queued app-ready message
            // can still carry the previously rendered tab. Retain the explicit
            // current Profile route in that narrow case rather than overwriting
            // it with the stale server snapshot.
            const profileTab = currentScreen === "account" && allowedProfileTabs.has(currentProfileTab)
              ? currentProfileTab
              : safeRouteValue(route && route.profile_tab);
            if (allowedProfileTabs.has(profileTab)) {
              nextUrl.searchParams.set("profile_tab", profileTab);
            }
          } else if (["admin", "projects"].includes(screen)) {
            // Keep a durable outer history entry for header destinations. Without
            // it, Projects from Upload leaves the URL at `/`, so browser Back
            // skips Upload and restores an older Profile route instead.
            nextUrl.searchParams.set("screen", screen);
          } else if (["file_review", "objects", "object_detail"].includes(screen)) {
            const routeToken = safeRouteValue(route && route.route_token);
            if (routeToken) {
              const routePrefix = {
                file_review: "r",
                objects: "e",
                object_detail: "o",
              }[screen];
              nextUrl.pathname = `/${routePrefix}/${routeToken}`;
            } else {
              const runId = safeRouteValue(route && route.run_id);
              const estimateId = safeRouteValue(route && route.estimate_id);
              const objectId = safeRouteValue(route && route.object_id);
              if (!runId) return;
              nextUrl.searchParams.set("screen", screen);
              nextUrl.searchParams.set("run_id", runId);
              if (estimateId) {
                nextUrl.searchParams.set("estimate_id", estimateId);
                if (screen === "object_detail" && objectId) {
                  nextUrl.searchParams.set("object_id", objectId);
                }
              }
            }
          }

          const nextPath = `${nextUrl.pathname}${nextUrl.search}${nextUrl.hash}`;
          const currentPath = `${window.location.pathname}${window.location.search}${window.location.hash}`;
          if (nextPath !== currentPath) {
            window.history.pushState({costerlyRoute: true}, "", nextPath);
          }
        }

        window.addEventListener("popstate", () => {
          window.location.reload();
        });

        function persistTimeline() {
          if (!timeline.length) return;
          const payload = JSON.stringify(timeline.splice(0, timeline.length));
          try {
            if (navigator.sendBeacon) {
              navigator.sendBeacon(
                "/api/runtime-events",
                new Blob([payload], {type: "application/json"})
              );
              return;
            }
            fetch("/api/runtime-events", {
              method: "POST",
              headers: {"content-type": "application/json"},
              body: payload,
              keepalive: true,
            }).catch(() => {});
          } catch (_) {}
        }

        function revealApp(source, screen = "unknown") {
          if (ready) return;
          ready = true;
          window.clearTimeout(fallbackTimer);
          mark("browser.app_reveal", {
            screen,
            status: source === "fallback" ? "timeout" : "ok",
            metadata: {source, ...navigationMetadata()},
          });
          if (frame) frame.classList.add("is-ready");
          if (mask) {
            mask.classList.add("is-hidden");
          }
          persistTimeline();
        }

        function concealInternalTransition(transition) {
          if (!maskedInternalTransitions.has(transition)) return;
          window.clearTimeout(internalTransitionTimer);
          if (frame) {
            frame.classList.add("is-transitioning");
            frame.classList.remove("is-ready");
          }
          if (mask) {
            mask.classList.add("is-transitioning");
            mask.classList.remove("is-hidden");
          }
          internalTransitionTimer = window.setTimeout(
            () => revealInternalTransition("timeout"),
            10000
          );
        }

        function revealInternalTransition(source) {
          window.clearTimeout(internalTransitionTimer);
          internalTransitionTimer = null;
          if (frame) {
            frame.classList.remove("is-transitioning");
            frame.classList.add("is-ready");
          }
          if (mask) {
            mask.classList.remove("is-transitioning");
            mask.classList.add("is-hidden");
          }
          if (source === "timeout") {
            mark("browser.internal_transition_timeout", {status: "timeout"});
            persistTimeline();
          }
        }

        mark("browser.wrapper_start", {metadata: navigationMetadata()});
        if (frame) {
          frame.addEventListener("load", () => {
            iframeLoadAtMs = performance.now();
            mark("browser.iframe_load");
          }, {once: true});
          mark("browser.iframe_request");
          frame.src = appUrl.toString();
        }

        window.addEventListener("message", (event) => {
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:recovery-fragment-consumed"
          ) {
            window.history.replaceState(
              window.history.state,
              "",
              `${window.location.pathname}${window.location.search}`,
            );
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:confirmation-fragment-consumed"
          ) {
            window.history.replaceState(window.history.state, "", "/");
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:recovery-complete"
          ) {
            window.history.replaceState(window.history.state, "", "/");
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:transition-click" &&
            typeof event.data.transition === "string"
          ) {
            const profileTab = safeRouteValue(event.data.profileTab);
            if (
              event.data.transition === "profile_tab_change" &&
              allowedProfileTabs.has(profileTab)
            ) {
              syncOuterRoute({ screen: "account", profile_tab: profileTab }, "account");
            }
            const pendingTransition = {
              id: String(event.data.transitionId || crypto.randomUUID()),
              name: event.data.transition,
              sourceScreen: safeRouteValue(event.data.sourceScreen),
              targetScreen: safeRouteValue(event.data.targetScreen),
              startedAt: performance.now(),
              visible: false,
              pythonRuns: 0,
              timeoutId: null,
            };
            pendingTransitions.push(pendingTransition);
            concealInternalTransition(pendingTransition.name);
            mark("browser.transition_click", {
              metadata: {
                transition: pendingTransition.name,
                transition_id: pendingTransition.id,
                source_screen: pendingTransition.sourceScreen,
                target_screen: pendingTransition.targetScreen,
              },
            });
            pendingTransition.timeoutId = window.setTimeout(() => {
              const index = pendingTransitions.indexOf(pendingTransition);
              if (index < 0) return;
              pendingTransitions.splice(index, 1);
              mark("browser.transition_timeout", {
                status: "timeout",
                duration_ms: performance.now() - pendingTransition.startedAt,
                metadata: {
                  transition: pendingTransition.name,
                  transition_id: pendingTransition.id,
                  source_screen: pendingTransition.sourceScreen,
                  target_screen: pendingTransition.targetScreen,
                  python_runs: pendingTransition.pythonRuns,
                },
              });
              if (ready) persistTimeline();
            }, 15000);
            if (ready) persistTimeline();
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:transition-styled" &&
            typeof event.data.transitionId === "string"
          ) {
            const transitionIndex = pendingTransitions.findIndex(
              (item) => item.id === event.data.transitionId
            );
            if (transitionIndex < 0) return;
            const pendingTransition = pendingTransitions.splice(transitionIndex, 1)[0];
            window.clearTimeout(pendingTransition.timeoutId);
            mark("browser.transition_styled", {
              duration_ms: performance.now() - pendingTransition.startedAt,
              metadata: {
                transition: pendingTransition.name,
                transition_id: pendingTransition.id,
              },
            });
            if (maskedInternalTransitions.has(pendingTransition.name)) {
              revealInternalTransition("target_styled");
            }
            if (ready) persistTimeline();
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:transition-stage" &&
            typeof event.data.transitionId === "string"
          ) {
            const transitionIndex = pendingTransitions.findIndex((item) =>
              item.id === event.data.transitionId &&
              item.targetScreen === String(event.data.screen || "")
            );
            if (transitionIndex < 0) return;
            const pendingTransition = pendingTransitions.splice(transitionIndex, 1)[0];
            window.clearTimeout(pendingTransition.timeoutId);
            mark("browser.transition_ready", {
              screen: String(event.data.screen || "unknown"),
              duration_ms: performance.now() - pendingTransition.startedAt,
              metadata: {
                transition: pendingTransition.name,
                transition_id: pendingTransition.id,
                source_screen: pendingTransition.sourceScreen,
                target_screen: pendingTransition.targetScreen,
                readiness: "stage_marker",
                python_runs: pendingTransition.pythonRuns,
              },
            });
            if (ready) persistTimeline();
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:transition-visible" &&
            typeof event.data.transitionId === "string"
          ) {
            const pendingTransition = pendingTransitions.find(
              (item) => item.id === event.data.transitionId
            );
            if (!pendingTransition || pendingTransition.visible) return;
            pendingTransition.visible = true;
            mark("browser.transition_visible", {
              duration_ms: performance.now() - pendingTransition.startedAt,
              metadata: {
                transition: pendingTransition.name,
                transition_id: pendingTransition.id,
              },
            });
            if (ready) persistTimeline();
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:startup-phase" &&
            event.data.traceId === traceId &&
            startupPhases.has(event.data.phase)
          ) {
            mark(`browser.${event.data.phase}`, {
              metadata: event.data.metadata || {},
            });
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:app-ready" &&
            event.data.traceId === traceId
          ) {
            const runId = String(event.data.runId || "");
            if (runId && readyRunIds.has(runId)) return;
            if (runId) readyRunIds.add(runId);
            const screen = event.data.screen || "unknown";
            const droppedHeaderTarget = pendingTransitions.find((item) => (
              screen === "upload" &&
              !item.routeRecoveryAttempted &&
              ["account", "admin", "projects"].includes(item.targetScreen)
            ));
            if (droppedHeaderTarget) {
              // On a fresh Streamlit process the browser can emit the header
              // click while the old websocket is being replaced. The outer
              // transition is recorded, but its callback never reaches the
              // new Python session, which renders Upload. Recover only this
              // proven mismatch by requesting the safe durable route once.
              droppedHeaderTarget.routeRecoveryAttempted = true;
              mark("browser.transition_route_recovery", {
                status: "unknown",
                metadata: {
                  transition: droppedHeaderTarget.name,
                  transition_id: droppedHeaderTarget.id,
                  expected_screen: droppedHeaderTarget.targetScreen,
                  received_screen: screen,
                },
              });
              const recoveryUrl = new URL(frame.src);
              routeKeys.forEach((key) => recoveryUrl.searchParams.delete(key));
              recoveryUrl.searchParams.set("screen", droppedHeaderTarget.targetScreen);
              frame.src = recoveryUrl.toString();
              return;
            }
            syncOuterRoute(event.data.route || {}, screen);
            const serverBuildVersion = String(
              event.data.buildVersion ||
              (event.data.metrics && event.data.metrics.server_build_version) ||
              ""
            );
            if (serverBuildVersion && serverBuildVersion !== BUILD_VERSION) {
              const mismatchPair = `${BUILD_VERSION}:${serverBuildVersion}`;
              const reloadGuardKey = "costerly:build-mismatch-reload";
              let reloadOnce = false;
              try {
                if (window.sessionStorage.getItem(reloadGuardKey) !== mismatchPair) {
                  window.sessionStorage.setItem(reloadGuardKey, mismatchPair);
                  reloadOnce = true;
                }
              } catch (_) {}
              mark("browser.build_mismatch", {
                screen,
                status: "error",
                metadata: {
                  wrapper_build: BUILD_VERSION,
                  server_build: serverBuildVersion,
                  reload_once: reloadOnce,
                },
              });
              persistTimeline();
              if (reloadOnce) {
                window.setTimeout(() => window.location.reload(), 50);
                return;
              }
            } else if (serverBuildVersion) {
              try {
                window.sessionStorage.removeItem("costerly:build-mismatch-reload");
              } catch (_) {}
            }
            const metadata = {
              server_run_id: runId,
              server_build_version: serverBuildVersion,
              ...(event.data.metrics || {}),
            };
            const serverRunStartedEpochMs = Number(metadata.server_run_started_epoch_ms);
            if (Number.isFinite(serverRunStartedEpochMs)) {
              const serverElapsedMs = Number(metadata.server_elapsed_ms || 0);
              const browserEpochMs = performance.timeOrigin + performance.now();
              const iframeLoadEpochMs = iframeLoadAtMs === null
                ? null
                : performance.timeOrigin + iframeLoadAtMs;
              mark("browser.server_run_start_observed", {
                metadata: {
                  browser_clock_offset_at_ready_ms: Math.round(
                    (browserEpochMs - serverRunStartedEpochMs - serverElapsedMs) * 1000
                  ) / 1000,
                  server_run_start_after_iframe_ms: iframeLoadEpochMs === null
                    ? null
                    : Math.round((serverRunStartedEpochMs - iframeLoadEpochMs) * 1000) / 1000,
                },
              });
            }
            pendingTransitions.forEach((item) => {
              item.pythonRuns += 1;
            });
            const failedSignIn =
              screen === "login" &&
              metadata.completed_action === "auth_sign_in" &&
              metadata.completed_action_status === "error";
            const transitionIndex = pendingTransitions.findIndex((item) => {
              if (failedSignIn) return item.name === "sign_in";
              if (item.targetScreen) return item.targetScreen === screen;
              return (expectedScreens[item.name] || []).includes(screen);
            });
            if (transitionIndex >= 0) {
              const pendingTransition = pendingTransitions[transitionIndex];
              if (!pendingTransition.readyReported) {
                pendingTransition.readyReported = true;
                mark("browser.transition_ready", {
                  screen,
                  status: failedSignIn ? "error" : "ok",
                  duration_ms: performance.now() - pendingTransition.startedAt,
                  metadata: {
                    transition: pendingTransition.name,
                    transition_id: pendingTransition.id,
                    source_screen: pendingTransition.sourceScreen,
                    target_screen: pendingTransition.targetScreen,
                    python_runs: pendingTransition.pythonRuns,
                    ...metadata,
                  },
                });
              }
              const loginTargetReady =
                screen === "login" &&
                metadata.auth_css_ready === true &&
                (
                  pendingTransition.name === "profile_to_sign_out" ||
                  pendingTransition.name === "upload_to_sign_out"
                );
              if (loginTargetReady) {
                pendingTransitions.splice(transitionIndex, 1);
                window.clearTimeout(pendingTransition.timeoutId);
                mark("browser.transition_styled", {
                  duration_ms: performance.now() - pendingTransition.startedAt,
                  metadata: {
                    transition: pendingTransition.name,
                    transition_id: pendingTransition.id,
                    source: "target_app_ready",
                  },
                });
                revealInternalTransition("target_app_ready");
              } else if (maskedInternalTransitions.has(pendingTransition.name)) {
                pendingTransitions.splice(transitionIndex, 1);
                window.clearTimeout(pendingTransition.timeoutId);
                mark("browser.transition_styled", {
                  duration_ms: performance.now() - pendingTransition.startedAt,
                  metadata: {
                    transition: pendingTransition.name,
                    transition_id: pendingTransition.id,
                    source: "target_app_ready",
                  },
                });
                revealInternalTransition("target_app_ready");
              } else if (!maskedInternalTransitions.has(pendingTransition.name)) {
                pendingTransitions.splice(transitionIndex, 1);
                window.clearTimeout(pendingTransition.timeoutId);
              }
            } else {
              mark("browser.app_ready_received", {screen, metadata});
            }
            if (ready) {
              persistTimeline();
            } else {
              revealApp("app_ready", screen);
            }
          }
        });

        window.addEventListener("pagehide", persistTimeline, {once: true});
        fallbackTimer = window.setTimeout(() => {
          mark("browser.app_ready_timeout", {status: "timeout"});
          revealApp("fallback");
        }, 8000);
      })();
    </script>
  </body>
</html>
