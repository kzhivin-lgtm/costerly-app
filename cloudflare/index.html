<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>costerly.ai</title>
    <meta name="costerly-wrapper-version" content="objects-v2.2-b20261121123415-compatibility-gate-estimation-v3.2-detection-v8.4.29" />

    <meta name="viewport" content="width=device-width, initial-scale=1" />
    <meta name="color-scheme" content="light" />
    <link rel="preconnect" href="https://core.costerly.ai" crossorigin />

    <link rel="icon" type="image/svg+xml" href="/favicon-large.svg?v=2" />
    <link rel="shortcut icon" href="/favicon-large.svg?v=2" />

    <style>
      html,
      body {
        color-scheme: light;
        width: 100%;
        height: 100%;
        margin: 0;
        padding: 0;
        overflow: hidden;
        background: #F1EFEF;
      }

      iframe {
        width: 100vw;
        height: 100vh;
        border: 0;
        display: block;
        background: #F1EFEF;
        opacity: 0;
        transition: opacity 120ms ease;
      }

      iframe.is-ready {
        opacity: 1;
      }

      .app-loading-mask {
        position: fixed;
        inset: 0;
        z-index: 10;
        background: #F1EFEF;
        opacity: 1;
        pointer-events: none;
        transition: opacity 160ms ease;
      }

      .app-loading-mask.is-hidden {
        opacity: 0;
      }

      .embed-footer-mask {
        position: fixed;
        left: 0;
        right: 0;
        bottom: 0;
        height: 46px;
        background: #F1EFEF;
        z-index: 2;
        display: flex;
        align-items: center;
        justify-content: center;
        font: 500 12px/1.3 system-ui, -apple-system, BlinkMacSystemFont, "Segoe UI", sans-serif;
      }

      .embed-footer-mask a {
        color: #67616C;
        text-decoration: none;
      }

      .embed-footer-mask a:hover,
      .embed-footer-mask a:focus-visible {
        color: #3B2E48;
        text-decoration: underline;
      }
    </style>
  </head>

  <body>
    <div class="app-loading-mask" id="app-loading-mask" aria-hidden="true"></div>
    <iframe
      id="costerly-app-frame"
      data-src="https://core.costerly.ai/?embed=true"
      title="costerly.ai"
      allow="clipboard-write; clipboard-read; fullscreen"
    ></iframe>
    <div class="embed-footer-mask">
      <a href="/privacy" target="_blank" rel="noopener">Privacy Policy</a>
    </div>
    <script>
      (() => {
        const BUILD_VERSION = "objects-v2.2-b20261121123415-compatibility-gate-estimation-v3.2-detection-v8.4.29";
        const startedAt = performance.now();
        const traceId = crypto.randomUUID();
        const timeline = [];
        const mask = document.getElementById("app-loading-mask");
        const frame = document.getElementById("costerly-app-frame");
        const backendByHostname = Object.freeze({
          "staging.costerly.ai": "https://core.costerly.ai/?embed=true",
        });
        const selectedBackend = backendByHostname[window.location.hostname];
        if (selectedBackend) frame.dataset.src = selectedBackend;
        const recoveryFragment = new URLSearchParams(window.location.hash.slice(1));
        const recoveryPath =
          /^\/recover\/?$/.test(window.location.pathname) ||
          recoveryFragment.get("type") === "recovery";
        const confirmationPath =
          /^\/confirm\/?$/.test(window.location.pathname) ||
          ["signup", "email"].includes(recoveryFragment.get("type"));
        const pathInvite = window.location.pathname.match(/^\/(?:start|join)\/([A-Za-z0-9_-]{43})\/?$/);
        const workflowPath = window.location.pathname.match(/^\/([reo])\/([A-Za-z0-9_-]{10,32})\/?$/);
        const inviteToken = pathInvite
          ? pathInvite[1]
          : new URLSearchParams(window.location.search).get("invite");
        const startupProbe = new URLSearchParams(window.location.search).get("startup_probe");
        const appUrl = new URL(frame.dataset.src);
        const appOrigin = appUrl.origin;
        const routeKeys = ["screen", "run_id", "estimate_id", "object_id", "route_token"];
        const outerParams = new URLSearchParams(window.location.search);
        appUrl.searchParams.set("obs_trace", traceId);
        routeKeys.forEach((key) => {
          const value = outerParams.get(key);
          if (value) appUrl.searchParams.set(key, value);
        });
        if (workflowPath) {
          const pathScreen = {r: "file_review", e: "objects", o: "object_detail"}[workflowPath[1]];
          appUrl.searchParams.set("screen", pathScreen);
          appUrl.searchParams.set("route_token", workflowPath[2]);
        }
        if (inviteToken && /^[A-Za-z0-9_-]{43}$/.test(inviteToken)) {
          appUrl.searchParams.set("invite", inviteToken);
        }
        if (recoveryPath) {
          appUrl.searchParams.set("auth_flow", "recovery");
          appUrl.hash = window.location.hash;
        }
        if (confirmationPath) {
          appUrl.searchParams.set("auth_flow", "confirmation");
          appUrl.hash = window.location.hash;
        }
        if (startupProbe === "anonymous") {
          appUrl.searchParams.set("startup_probe", "anonymous");
        }
        let fallbackTimer = null;
        let iframeLoadAtMs = null;
        let ready = false;
        let resumePending = !navigator.onLine;
        let uploadSelectionPending = false;
        let deployRefreshBlocked = false;
        const deployRefreshKey = "costerly.deploy-refresh.v1";
        let pendingServerBuild = "";
        let uploadInteractionBusy = false;
        const receivedBuilds = new Set();
        const readyRunIds = new Set();
        const pendingTransitions = [];
        let coveredTransitionId = "";
        let lastReadyScreen = "";
        let lastReadyRunId = "";
        let sendingTimeline = false;
        let retryCount = 0;
        const browserFailures = new Map();
        const expectedScreens = {
          sign_in: ["upload", "account", "company_setup"],
          upload_to_profile: ["account"],
          profile_to_upload: ["upload"],
          upload_to_admin: ["admin"],
          profile_to_admin: ["admin"],
          admin_to_profile: ["account"],
          admin_to_upload: ["upload"],
          profile_to_sign_out: ["login"],
          upload_to_sign_out: ["login"],
        };
        const startupPhases = new Set([
          "auth_component_script",
          "auth_component_render",
          "auth_storage_read",
          "auth_value_sent",
        ]);

        function mark(eventName, detail = {}) {
          const event = {
            occurred_at: new Date().toISOString(),
            schema_version: "runtime_v1",
            build_version: BUILD_VERSION,
            source: "browser",
            trace_id: traceId,
            event_name: eventName,
            screen: detail.screen || "unknown",
            status: detail.status || "ok",
            elapsed_ms: Math.round((performance.now() - startedAt) * 1000) / 1000,
            metadata: detail.metadata || {},
          };
          if (detail.duration_ms !== undefined) {
            event.duration_ms = Math.round(Number(detail.duration_ms) * 1000) / 1000;
          }
          if (detail.runId) event.run_id = detail.runId;
          timeline.push(event);
          performance.mark(`costerly:${eventName}`);
        }

        function navigationMetadata() {
          const navigation = performance.getEntriesByType("navigation")[0];
          if (!navigation) return {};
          return {
            navigation_type: navigation.type,
            ttfb_ms: Math.round(navigation.responseStart * 1000) / 1000,
            response_end_ms: Math.round(navigation.responseEnd * 1000) / 1000,
            dom_interactive_ms: Math.round(navigation.domInteractive * 1000) / 1000,
            dom_content_loaded_ms: Math.round(navigation.domContentLoadedEventEnd * 1000) / 1000,
            load_event_ms: Math.round(navigation.loadEventEnd * 1000) / 1000,
          };
        }

        function safeRouteValue(value) {
          const text = String(value || "");
          return /^[A-Za-z0-9_-]{1,160}$/.test(text) ? text : "";
        }

        function syncOuterRoute(route, renderedScreen) {
          const nextUrl = new URL(window.location.href);
          routeKeys.forEach((key) => nextUrl.searchParams.delete(key));
          // Old Profile URLs may still carry a selected-tab hint. Profile
          // navigation is intentionally screen-level only, so discard it.
          nextUrl.searchParams.delete("profile_tab");

          // A workflow path must not survive navigation to Profile, Upload or
          // Admin. It would otherwise be reinterpreted after a browser refresh.
          if (/^\/[reo]\/[A-Za-z0-9_-]{10,32}\/?$/.test(nextUrl.pathname)) {
            nextUrl.pathname = "/";
          }

          const requestedScreen = safeRouteValue(route && route.screen);
          const screen = requestedScreen || safeRouteValue(renderedScreen);
          if (screen === "account") {
            nextUrl.searchParams.set("screen", "account");
          } else if (["admin", "projects"].includes(screen)) {
            // Keep a durable outer history entry for header destinations. Without
            // it, Projects from Upload leaves the URL at `/`, so browser Back
            // skips Upload and restores an older Profile route instead.
            nextUrl.searchParams.set("screen", screen);
          } else if (["file_review", "objects", "object_detail"].includes(screen)) {
            const routeToken = safeRouteValue(route && route.route_token);
            if (routeToken) {
              const routePrefix = {
                file_review: "r",
                objects: "e",
                object_detail: "o",
              }[screen];
              nextUrl.pathname = `/${routePrefix}/${routeToken}`;
            } else {
              const runId = safeRouteValue(route && route.run_id);
              const estimateId = safeRouteValue(route && route.estimate_id);
              const objectId = safeRouteValue(route && route.object_id);
              if (!runId) return;
              nextUrl.searchParams.set("screen", screen);
              nextUrl.searchParams.set("run_id", runId);
              if (estimateId) {
                nextUrl.searchParams.set("estimate_id", estimateId);
                if (screen === "object_detail" && objectId) {
                  nextUrl.searchParams.set("object_id", objectId);
                }
              }
            }
          }

          const nextPath = `${nextUrl.pathname}${nextUrl.search}${nextUrl.hash}`;
          const currentPath = `${window.location.pathname}${window.location.search}${window.location.hash}`;
          if (nextPath !== currentPath) {
            window.history.pushState({costerlyRoute: true}, "", nextPath);
          }
        }

        function resetOuterRouteForNewEstimate() {
          // This is deliberately not a normal workflow navigation. A New
          // Estimate invalidates the current object token immediately, even
          // when an old Streamlit websocket never receives its callback.
          const nextUrl = new URL(window.location.href);
          routeKeys.forEach((key) => nextUrl.searchParams.delete(key));
          nextUrl.searchParams.delete("profile_tab");
          nextUrl.pathname = "/";
          const nextPath = `${nextUrl.pathname}${nextUrl.search}${nextUrl.hash}`;
          window.history.replaceState({costerlyRoute: true}, "", nextPath);
          mark("browser.new_estimate_route_cleared", {
            metadata: {outer_path: nextPath},
          });
        }

        function revalidateConnection() {
          if (!resumePending || !navigator.onLine || document.hidden ||
              uploadSelectionPending || pendingTransitions.length || coveredTransitionId ||
              lastReadyScreen === "processing") return;
          resumePending = false;
          if (recoveryPath || confirmationPath || lastReadyScreen === "login") return;
          // A disconnected Streamlit iframe can still show its old authorized
          // page. Bootstrap against the server again at the current outer URL.
          mark("browser.connection_resume", {screen: lastReadyScreen});
          window.location.reload();
        }

        window.addEventListener("offline", () => { resumePending = true; });
        window.addEventListener("online", () => {
          resumePending = true;
          revalidateConnection();
        });
        document.addEventListener("visibilitychange", revalidateConnection);
        window.addEventListener("pageshow", (event) => {
          if (!event.persisted) return;
          resumePending = true;
          revalidateConnection();
        });

        window.addEventListener("popstate", () => {
          window.location.reload();
        });

        function persistTimeline(unloading = false) {
          if (!timeline.length || (sendingTimeline && !unloading)) return;
          const batch = timeline.splice(0, 20);
          const encoder = new TextEncoder();
          let payload = JSON.stringify(batch);
          while (batch.length > 1 && encoder.encode(payload).byteLength > 14 * 1024) {
            timeline.unshift(batch.pop());
            payload = JSON.stringify(batch);
          }
          if (unloading && navigator.sendBeacon &&
              navigator.sendBeacon("/api/runtime-events", new Blob([payload], {type: "application/json"}))) return;
          sendingTimeline = true;
          fetch("/api/runtime-events", {
            method: "POST",
            headers: {"content-type": "application/json"},
            body: payload,
            keepalive: true,
          }).then((result) => {
            if (result.status >= 500 || result.status === 429) throw new Error("telemetry_delivery");
            retryCount = 0;
            sendingTimeline = false;
            if (!unloading) persistTimeline();
          }).catch(() => {
            if (!unloading && retryCount < 2) {
              timeline.unshift(...batch);
              retryCount += 1;
              window.setTimeout(() => {
                sendingTimeline = false;
                persistTimeline();
              }, retryCount * 1000);
            } else {
              sendingTimeline = false;
              retryCount = 0;
            }
          });
        }

        const failureKinds = new Set(["wrapper_error", "wrapper_rejection", "app_error", "app_rejection",
                                      "server_exception_rendered", "error_alert_rendered"]);
        const errorTypes = new Set(["Error", "TypeError", "RangeError", "ReferenceError", "SyntaxError",
                                    "NetworkError", "SecurityError", "NotFoundError", "AbortError",
                                    "QuotaExceededError", "dom_remove_child", "unknown"]);

        function reportBrowserFailure({kind, errorType, screen, runId, line}) {
          if (!failureKinds.has(kind)) return;
          const type = errorTypes.has(errorType) ? errorType : "unknown";
          const sourceScreen = safeRouteValue(screen || lastReadyScreen) || "unknown";
          const sourceRun = safeRouteValue(runId || lastReadyRunId) || null;
          const sourceLine = Number.isInteger(line) && line > 0 && line < 1000000 ? line : null;
          const key = [kind, type, sourceScreen, sourceRun, sourceLine].join(":");
          const now = performance.now();
          for (const [previous, seen] of browserFailures) {
            if (now - seen > 5000) browserFailures.delete(previous);
          }
          if (browserFailures.has(key) || browserFailures.size >= 16) return;
          browserFailures.set(key, now);
          mark("browser.runtime_failure", {status: "error", screen: sourceScreen, runId: sourceRun,
            metadata: {kind, error_type: type, line: sourceLine}});
          persistTimeline();
        }

        window.addEventListener("error", (event) => reportBrowserFailure({
          kind: "wrapper_error", errorType: event.error && event.error.name, line: event.lineno,
        }));
        window.addEventListener("unhandledrejection", (event) => reportBrowserFailure({
          kind: "wrapper_rejection", errorType: event.reason && event.reason.name,
        }));

        function revealApp(source, screen = "unknown") {
          if (ready) return;
          ready = true;
          window.clearTimeout(fallbackTimer);
          mark("browser.app_reveal", {
            screen,
            status: source === "fallback" ? "timeout" : "ok",
            metadata: {source, ...navigationMetadata()},
          });
          if (frame) frame.classList.add("is-ready");
          if (mask) {
            mask.classList.add("is-hidden");
          }
          persistTimeline();
        }

        function releaseDeployCover() {
          if (!deployRefreshBlocked) return;
          deployRefreshBlocked = false;
          frame.inert = false;
          frame.classList.add("is-ready");
          mask.style.cssText = "";
          mask.classList.add("is-hidden");
          mask.setAttribute("aria-hidden", "true");
          mask.removeAttribute("role");
        }

        function forceDeployRefresh(serverBuildVersion) {
          // Full outer reload preserves browser auth storage and cookies.
          // No auth request, logout, token clear or server rerun is issued here.
          if (deployRefreshBlocked) return;
          deployRefreshBlocked = true;
          ready = true;
          window.clearTimeout(fallbackTimer);
          frame.inert = true;
          mask.classList.remove("is-hidden");
          mask.removeAttribute("aria-hidden");
          mask.setAttribute("role", "status");
          mask.style.cssText = "display:flex;flex-direction:column;align-items:center;justify-content:center;pointer-events:auto;font:500 1rem system-ui;color:#392c47;";
          mask.textContent = "Updating app…";
          let canReload = false;
          try {
            canReload = window.sessionStorage.getItem(deployRefreshKey) !== serverBuildVersion;
            if (canReload) window.sessionStorage.setItem(deployRefreshKey, serverBuildVersion);
          } catch (_) { canReload = false; }
          if (canReload) {
            mark("browser.deploy_refresh", {screen: lastReadyScreen, metadata: {target_build: serverBuildVersion}});
            persistTimeline(true);
            window.location.reload();
            return;
          }
          mask.textContent = "The app update is not ready yet. Reload to retry.";
          const retry = document.createElement("button");
          retry.textContent = "Reload page";
          retry.style.cssText = "margin-top:0.5rem;padding:0.5rem 1rem;cursor:pointer;";
          retry.addEventListener("click", () => window.location.reload());
          mask.append(retry);
          retry.focus();
        }

        function maybeRefreshServerBuild() {
          if (!pendingServerBuild || pendingServerBuild === BUILD_VERSION ||
              uploadSelectionPending || uploadInteractionBusy || coveredTransitionId ||
              pendingTransitions.length || !["upload", "login"].includes(lastReadyScreen)) return;
          forceDeployRefresh(pendingServerBuild);
        }

        mark("browser.wrapper_start", {metadata: navigationMetadata()});
        if (frame) {
          frame.addEventListener("load", () => {
            iframeLoadAtMs = performance.now();
            mark("browser.iframe_load");
          }, {once: true});
          mark("browser.iframe_request");
          frame.src = appUrl.toString();
        }

        window.addEventListener("message", (event) => {
          if (event.origin === appOrigin && event.source === frame.contentWindow &&
              event.data?.type === "costerly:workflow-protection" && event.data.traceId === traceId &&
              ["compatible", "cover_start", "cover_end", "recovery_start", "recovery_end", "update_deferred", "update_requested"].includes(event.data.phase)) {
            mark("browser.workflow_protection", {screen: safeRouteValue(event.data.screen), metadata: {
              phase: event.data.phase, protocol: event.data.protocol,
              revision: safeRouteValue(event.data.revision), reason: safeRouteValue(event.data.reason),
              transition: safeRouteValue(event.data.transition), transition_id: safeRouteValue(event.data.transitionId),
              regional: event.data.regional === true, wrapper_build: BUILD_VERSION,
            }});
            if (ready) persistTimeline();
            return;
          }
          if (event.origin === appOrigin && event.source === frame.contentWindow &&
              event.data?.type === "costerly:build-available" && event.data.traceId === traceId) {
            const build = String(event.data.buildVersion || "");
            if (receivedBuilds.has(build)) return;
            receivedBuilds.add(build);
            const order = value => Number(value.match(/-b([0-9]{14})-/)?.[1] || 0);
            if (build === BUILD_VERSION) {
              try { window.sessionStorage.removeItem(deployRefreshKey); } catch (_) {}
              releaseDeployCover();
            } else if (order(build) > order(BUILD_VERSION)) {
              pendingServerBuild = build;
              maybeRefreshServerBuild();
            }
            return;
          }
          if (event.origin === appOrigin && event.source === frame.contentWindow &&
              event.data?.type === "costerly:deploy-refresh-state" && event.data.traceId === traceId) {
            uploadInteractionBusy = event.data.busy === true;
            maybeRefreshServerBuild();
            return;
          }
          if (event.origin === appOrigin && event.data?.type === "costerly:runtime-failure" &&
              event.data.traceId === traceId) {
            reportBrowserFailure(event.data);
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:rfq-upload-selected"
          ) {
            uploadSelectionPending = true;
            mark("browser.rfq_upload_selected", {
              metadata: {
                source: safeRouteValue(event.data.source),
                cycle_id: safeRouteValue(event.data.cycleId),
              },
            });
            if (ready) persistTimeline();
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:upload-callback-timeout"
          ) {
            uploadSelectionPending = false;
            mark("browser.upload_callback_timeout", {
              status: "timeout",
              metadata: {
                source: safeRouteValue(event.data.source),
                cycle_id: safeRouteValue(event.data.cycleId),
              },
            });
            if (ready) persistTimeline();
            revalidateConnection();
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:recovery-fragment-consumed"
          ) {
            window.history.replaceState(
              window.history.state,
              "",
              `${window.location.pathname}${window.location.search}`,
            );
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:confirmation-fragment-consumed"
          ) {
            window.history.replaceState(window.history.state, "", "/");
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:recovery-complete"
          ) {
            window.history.replaceState(window.history.state, "", "/");
            return;
          }
          if (event.origin === appOrigin &&
              event.data?.type === "costerly:workflow-navigation-reload" &&
              event.data.traceId === traceId && coveredTransitionId &&
              event.data.transitionId === coveredTransitionId) {
            window.location.reload();
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:transition-click" &&
            typeof event.data.transition === "string"
          ) {
            const pendingTransition = {
              id: String(event.data.transitionId || crypto.randomUUID()),
              name: event.data.transition,
              sourceScreen: safeRouteValue(event.data.sourceScreen),
              targetScreen: safeRouteValue(event.data.targetScreen),
              cycleId: safeRouteValue(event.data.cycleId),
              startedAt: performance.now(),
              visible: false,
              pythonRuns: 0,
              timeoutId: null,
              styledReported: false,
              stageReported: false,
              covered: event.data.workflowNavigation === true && event.data.traceId === traceId,
            };
            pendingTransitions.push(pendingTransition);
            if (pendingTransition.covered) coveredTransitionId = pendingTransition.id;
            if (pendingTransition.name === "new_estimate") {
              resetOuterRouteForNewEstimate();
            }
            // The live iframe owns navigation and visual readiness. The
            // wrapper records the intent and keeps the public URL in sync.
            mark("browser.transition_click", {
              metadata: {
                transition: pendingTransition.name,
                transition_id: pendingTransition.id,
                source_screen: pendingTransition.sourceScreen,
                target_screen: pendingTransition.targetScreen,
                cycle_id: pendingTransition.cycleId,
                covered: pendingTransition.covered,
              },
            });
            pendingTransition.timeoutId = window.setTimeout(() => {
              const index = pendingTransitions.indexOf(pendingTransition);
              if (index < 0) return;
              pendingTransitions.splice(index, 1);
              mark("browser.transition_timeout", {
                status: "timeout",
                duration_ms: performance.now() - pendingTransition.startedAt,
                metadata: {
                  transition: pendingTransition.name,
                  transition_id: pendingTransition.id,
                  source_screen: pendingTransition.sourceScreen,
                  target_screen: pendingTransition.targetScreen,
                  cycle_id: pendingTransition.cycleId,
                  python_runs: pendingTransition.pythonRuns,
                },
              });
              if (ready) persistTimeline();
              revalidateConnection();
            }, 15000);
            if (ready) persistTimeline();
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:transition-failed" &&
            typeof event.data.transitionId === "string"
          ) {
            const transitionIndex = pendingTransitions.findIndex(
              (item) => item.id === event.data.transitionId
            );
            if (transitionIndex < 0) return;
            const pendingTransition = pendingTransitions[transitionIndex];
            pendingTransitions.splice(transitionIndex, 1);
            window.clearTimeout(pendingTransition.timeoutId);
            mark("browser.transition_failed", {
              status: "error",
              duration_ms: performance.now() - pendingTransition.startedAt,
              metadata: {
                transition: pendingTransition.name,
                transition_id: pendingTransition.id,
                source_screen: pendingTransition.sourceScreen,
                target_screen: pendingTransition.targetScreen,
                reason: safeRouteValue(event.data.reason) || "target_render_error",
              },
            });
            if (ready) persistTimeline();
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:transition-styled" &&
            typeof event.data.transitionId === "string"
          ) {
            const transitionIndex = pendingTransitions.findIndex(
              (item) => item.id === event.data.transitionId
            );
            if (transitionIndex < 0) return;
            const pendingTransition = pendingTransitions[transitionIndex];
            if (pendingTransition.styledReported) return;
            pendingTransition.styledReported = true;
            mark("browser.transition_styled", {
              duration_ms: performance.now() - pendingTransition.startedAt,
              metadata: {
                transition: pendingTransition.name,
                transition_id: pendingTransition.id,
                cycle_id: pendingTransition.cycleId,
              },
            });
            if (ready) persistTimeline();
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:transition-stage" &&
            typeof event.data.transitionId === "string"
          ) {
            const transitionIndex = pendingTransitions.findIndex((item) =>
              item.id === event.data.transitionId &&
              item.targetScreen === String(event.data.screen || "")
            );
            if (transitionIndex < 0) return;
            const pendingTransition = pendingTransitions[transitionIndex];
            if (pendingTransition.stageReported) return;
            pendingTransition.stageReported = true;
            // A stage marker proves that a target shell exists. It is not a
            // completed route: only the correlated core app-ready closes the
            // transition and makes its timing comparable across screens.
            mark("browser.transition_stage", {
              screen: String(event.data.screen || "unknown"),
              duration_ms: performance.now() - pendingTransition.startedAt,
              metadata: {
                transition: pendingTransition.name,
                transition_id: pendingTransition.id,
                source_screen: pendingTransition.sourceScreen,
                target_screen: pendingTransition.targetScreen,
                cycle_id: pendingTransition.cycleId,
                readiness: "stage_marker",
                python_runs: pendingTransition.pythonRuns,
              },
            });
            if (ready) persistTimeline();
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:transition-visible" &&
            typeof event.data.transitionId === "string"
          ) {
            const pendingTransition = pendingTransitions.find(
              (item) => item.id === event.data.transitionId
            );
            if (!pendingTransition || pendingTransition.visible) return;
            pendingTransition.visible = true;
            mark("browser.transition_visible", {
              duration_ms: performance.now() - pendingTransition.startedAt,
              metadata: {
                transition: pendingTransition.name,
                transition_id: pendingTransition.id,
              },
            });
            if (ready) persistTimeline();
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:startup-phase" &&
            event.data.traceId === traceId &&
            startupPhases.has(event.data.phase)
          ) {
            mark(`browser.${event.data.phase}`, {
              metadata: event.data.metadata || {},
            });
            return;
          }
          if (
            event.origin === appOrigin &&
            event.data &&
            event.data.type === "costerly:app-ready" &&
            event.data.traceId === traceId
          ) {
            if (event.data.workflowNavigationProtocol === 1) {
              frame.contentWindow.postMessage({
                type: "costerly:workflow-navigation-enabled", protocol: 1, traceId,
                buildVersion: BUILD_VERSION, deployRefreshProtocol: 1, buildSignalProtocol: 1,
              }, appOrigin);
            }
            const completedTransitionId = String(event.data.transitionId || "");
            if (coveredTransitionId && completedTransitionId !== coveredTransitionId) return;
            if (coveredTransitionId) coveredTransitionId = "";
            const runId = String(event.data.runId || "");
            if (runId && readyRunIds.has(runId)) return;
            if (runId) readyRunIds.add(runId);
            const screen = event.data.screen || "unknown";
            lastReadyScreen = screen;
            lastReadyRunId = runId;
            if (screen !== "upload") {
              uploadSelectionPending = false;
              uploadInteractionBusy = false;
            }
            // The native connection already revalidated and painted a fresh
            // screen while a transition was completing.
            if (navigator.onLine) resumePending = false;
            const droppedHeaderTarget = pendingTransitions.find((item) => (
              screen === "upload" &&
              ["account", "admin", "projects"].includes(item.targetScreen)
            ));
            if (droppedHeaderTarget) {
              // A lost browser-to-Streamlit callback is an observable
              // transport failure, not permission to create a competing
              // iframe route. Preserve the visible session and report it.
              mark("browser.transition_target_mismatch", {
                status: "error",
                metadata: {
                  transition: droppedHeaderTarget.name,
                  transition_id: droppedHeaderTarget.id,
                  expected_screen: droppedHeaderTarget.targetScreen,
                  received_screen: screen,
                },
              });
            }
            syncOuterRoute(event.data.route || {}, screen);
            const serverBuildVersion = String(
              event.data.buildVersion ||
              (event.data.metrics && event.data.metrics.server_build_version) ||
              ""
            );
            // Auth expiry or a late accepted upload remains authoritative,
            // even while an older Core is waiting for an available update.
            if (!["upload", "login"].includes(screen)) releaseDeployCover();
            if (serverBuildVersion && serverBuildVersion !== BUILD_VERSION) {
              mark("browser.build_mismatch", {
                screen,
                status: "error",
                metadata: {
                  wrapper_build: BUILD_VERSION,
                  server_build: serverBuildVersion,
                  recovery: "published_build_refresh",
                },
              });
              persistTimeline();
            }
            const appReadySentAt = Number(event.data.sentAt);
            const appReadyDeliveryMs = Number.isFinite(appReadySentAt)
              ? Math.max(0, Math.round((Date.now() - appReadySentAt) * 1000) / 1000)
              : null;
            const metadata = {
              // Runtime ingestion retains the first 30 keys, so keep this
              // boundary before the verbose server summary.
              app_ready_postmessage_ms: appReadyDeliveryMs,
              server_run_id: runId,
              server_build_version: serverBuildVersion,
              ...(event.data.metrics || {}),
            };
            const serverRunStartedEpochMs = Number(metadata.server_run_started_epoch_ms);
            if (Number.isFinite(serverRunStartedEpochMs)) {
              const serverElapsedMs = Number(metadata.server_elapsed_ms || 0);
              const browserEpochMs = performance.timeOrigin + performance.now();
              const iframeLoadEpochMs = iframeLoadAtMs === null
                ? null
                : performance.timeOrigin + iframeLoadAtMs;
              mark("browser.server_run_start_observed", {
                metadata: {
                  browser_clock_offset_at_ready_ms: Math.round(
                    (browserEpochMs - serverRunStartedEpochMs - serverElapsedMs) * 1000
                  ) / 1000,
                  server_run_start_after_iframe_ms: iframeLoadEpochMs === null
                    ? null
                    : Math.round((serverRunStartedEpochMs - iframeLoadEpochMs) * 1000) / 1000,
                },
              });
            }
            pendingTransitions.forEach((item) => {
              item.pythonRuns += 1;
            });
            const newEstimateCallback = pendingTransitions.find((item) => (
              item.name === "new_estimate" &&
              metadata.new_estimate_callback_received === true &&
              !item.callbackReceived
            ));
            if (newEstimateCallback) {
              newEstimateCallback.callbackReceived = true;
              mark("browser.new_estimate_callback_received", {
                duration_ms: performance.now() - newEstimateCallback.startedAt,
                metadata: {
                  transition_id: newEstimateCallback.id,
                  python_runs: newEstimateCallback.pythonRuns,
                  callback_to_run_ms: metadata.new_estimate_callback_to_run_ms,
                  reset_session_ms: metadata.new_estimate_reset_session_ms,
                  callback_total_ms: metadata.new_estimate_callback_total_ms,
                },
              });
            }
            const failedSignIn =
              screen === "login" &&
              metadata.completed_action === "auth_sign_in" &&
              metadata.completed_action_status === "error";
            const transitionIndex = pendingTransitions.findIndex((item) => {
              if (item.covered || completedTransitionId) return item.id === completedTransitionId;
              if (failedSignIn) return item.name === "sign_in";
              if (item.targetScreen) return item.targetScreen === screen;
              return (expectedScreens[item.name] || []).includes(screen);
            });
            if (transitionIndex >= 0) {
              const pendingTransition = pendingTransitions[transitionIndex];
              if (screen === "upload") { uploadSelectionPending = false; uploadInteractionBusy = false; }
              if (!pendingTransition.readyReported) {
                pendingTransition.readyReported = true;
                mark("browser.transition_ready", {
                  screen,
                  status: failedSignIn || screen !== (pendingTransition.targetScreen || screen) ? "error" : "ok",
                  duration_ms: performance.now() - pendingTransition.startedAt,
                  metadata: {
                    transition: pendingTransition.name,
                    transition_id: pendingTransition.id,
                    source_screen: pendingTransition.sourceScreen,
                    target_screen: pendingTransition.targetScreen,
                    python_runs: pendingTransition.pythonRuns,
                    covered: pendingTransition.covered,
                    ...metadata,
                  },
                });
              }
              pendingTransitions.splice(transitionIndex, 1);
              window.clearTimeout(pendingTransition.timeoutId);
            } else {
              mark("browser.app_ready_received", {screen, metadata});
            }
            if (ready) {
              persistTimeline();
            } else {
              revealApp("app_ready", screen);
            }
            maybeRefreshServerBuild();
          }
        });

        window.addEventListener("pagehide", () => persistTimeline(true), {once: true});
        fallbackTimer = window.setTimeout(() => {
          mark("browser.app_ready_timeout", {status: "timeout"});
          revealApp("fallback");
        }, 8000);
      })();
    </script>
  </body>
</html>
