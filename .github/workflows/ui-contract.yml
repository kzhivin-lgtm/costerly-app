name: UI contract

on:
  push:
    branches-ignore: [main]
  pull_request:
    branches: [main]
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: ui-contract-${{ github.event.pull_request.head.ref || github.ref }}
  cancel-in-progress: true

jobs:
  ui-release-gate:
    name: UI release gate
    runs-on: ubuntu-latest
    timeout-minutes: 15
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0
          ref: ${{ github.event.pull_request.head.sha || github.sha }}
      - name: Classify cumulative changes
        id: plan
        run: python3 tools/ui_gate_plan.py >> "$GITHUB_OUTPUT"
      - uses: astral-sh/setup-uv@v6
        if: steps.plan.outputs.full == 'true'
        with:
          version: 0.13.5
          enable-cache: true
      - uses: actions/setup-node@v4
        if: steps.plan.outputs.full == 'true'
        with:
          node-version: '24'
          cache: npm
          cache-dependency-path: tests/ui/package-lock.json
      - name: Install locked Python dependencies
        if: steps.plan.outputs.full == 'true'
        run: uv sync --locked --group ui-test --no-install-project
      - name: Install locked browser dependencies
        if: steps.plan.outputs.full == 'true'
        run: npm ci --prefix tests/ui --ignore-scripts
      - uses: actions/cache@v4
        if: steps.plan.outputs.full == 'true'
        with:
          path: ~/.cache/ms-playwright
          key: playwright-${{ runner.os }}-${{ hashFiles('tests/ui/package-lock.json') }}
      - name: Install Chromium
        if: steps.plan.outputs.full == 'true'
        run: tests/ui/node_modules/.bin/playwright install --with-deps chromium
      - name: Run complete UI contract
        if: steps.plan.outputs.full == 'true'
        run: uv run --locked --group ui-test python tools/run_ui_contract.py
      - name: Verify gate completion
        if: always()
        env:
          FULL: ${{ steps.plan.outputs.full }}
          JOB_STATUS: ${{ job.status }}
        run: |
          test "$JOB_STATUS" = success
          if [ "$FULL" = true ]; then
            python3 -c 'import json; r=json.load(open(".ui-artifacts/gate-report.json")); assert r["status"] == "passed", r'
          else
            test "$FULL" = false
            echo "Documentation-only candidate; runtime contract unchanged."
          fi
      - name: Preserve timings and failure evidence
        uses: actions/upload-artifact@v4
        if: always() && steps.plan.outputs.full == 'true'
        with:
          name: ui-contract-${{ github.sha }}
          path: .ui-artifacts/
          retention-days: 14
