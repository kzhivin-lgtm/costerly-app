<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /></head>
  <body>
    <script>
      (() => {
        const parentWindow = window.parent;
        const parentDoc = parentWindow.document;
        const cleanupKey = "__costerlyCompanyLaborBridgeCleanup";

        function send(type, payload = {}) {
          parentWindow.postMessage(
            {isStreamlitMessage: true, type, ...payload},
            "*"
          );
        }

        function install() {
          if (parentWindow[cleanupKey]) parentWindow[cleanupKey]();

          function handleAction(event) {
            const actionElement = event.target && event.target.closest
              ? event.target.closest(
                  "[data-company-labor-edit], [data-company-labor-delete], " +
                  "[data-company-user-delete]"
                )
              : null;
            if (!actionElement) return;
            event.preventDefault();
            event.stopPropagation();
            send("streamlit:setComponentValue", {
              value: JSON.stringify({
                action: actionElement.hasAttribute("data-company-user-delete")
                  ? "user_delete"
                  : actionElement.hasAttribute("data-company-labor-delete")
                    ? "delete"
                    : "edit",
                employeeId: actionElement.dataset.employeeId || "",
                memberId: actionElement.dataset.memberId || "",
                nonce: `${Date.now()}-${Math.random().toString(36).slice(2)}`,
              }),
            });
          }

          parentDoc.addEventListener("click", handleAction, true);
          parentWindow[cleanupKey] = () => {
            parentDoc.removeEventListener("click", handleAction, true);
            parentWindow[cleanupKey] = null;
          };
        }

        window.addEventListener("message", (event) => {
          const message = event.data || {};
          if (message.type !== "streamlit:render") return;
          install();
          send("streamlit:setFrameHeight", {height: 0});
        });

        send("streamlit:componentReady", {apiVersion: 1});
        send("streamlit:setFrameHeight", {height: 0});
      })();
    </script>
  </body>
</html>
