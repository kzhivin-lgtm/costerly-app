<!doctype html>
<html lang="en">
  <head><meta charset="utf-8" /></head>
  <body>
    <script>
      (() => {
        const storageKey = "costerly.supabase.session.v1";
        const resumeCookieName = "__Host-costerly-resume-v1";
        const resumeCookieMaxAge = 30 * 60;
        let lastValue = null;

        function iframePerformanceNow() {
          try {
            return Math.round(window.parent.performance.now() * 1000) / 1000;
          } catch (_) {
            return null;
          }
        }

        const componentScriptEvaluatedAt = iframePerformanceNow();

        function iframeNavigationTiming() {
          try {
            const navigation = window.parent.performance.getEntriesByType("navigation")[0];
            if (!navigation) return {};
            return {
              iframe_response_start_ms: Math.round(navigation.responseStart * 1000) / 1000,
              iframe_response_end_ms: Math.round(navigation.responseEnd * 1000) / 1000,
              iframe_dom_interactive_ms: Math.round(navigation.domInteractive * 1000) / 1000,
              iframe_dom_content_loaded_ms:
                Math.round(navigation.domContentLoadedEventEnd * 1000) / 1000,
              iframe_load_event_end_ms: Math.round(navigation.loadEventEnd * 1000) / 1000,
            };
          } catch (_) {
            return {};
          }
        }

        function startupPhase(args, phase, metadata = {}) {
          if (!args.traceId) return;
          try {
            window.top.postMessage({
              type: "costerly:startup-phase",
              traceId: args.traceId,
              phase,
              metadata: {
                run_sequence: Number(args.runSequence || 0),
                server_run_id: String(args.runId || ""),
                iframe_performance_now_ms: iframePerformanceNow(),
                server_elapsed_before_component_ms:
                  Number(args.serverElapsedBeforeComponentMs || 0),
                ...metadata,
              },
            }, "*");
          } catch (_) {}
        }

        function storeResumeCookie(value) {
          if (!value || typeof value !== "string") return;
          document.cookie =
            `${resumeCookieName}=${encodeURIComponent(value)}; ` +
            `Max-Age=${resumeCookieMaxAge}; Path=/; Secure; SameSite=None; Partitioned`;
        }

        function clearResumeCookie() {
          document.cookie =
            `${resumeCookieName}=; Max-Age=0; Path=/; Secure; SameSite=None; Partitioned`;
        }

        function send(type, payload = {}) {
          window.parent.postMessage(
            {isStreamlitMessage: true, type, ...payload},
            "*"
          );
        }

        function readSession() {
          try {
            const raw = window.sessionStorage.getItem(storageKey);
            if (!raw) return null;
            const value = JSON.parse(raw);
            return value && typeof value === "object" ? value : null;
          } catch (_) {
            return null;
          }
        }

        function readRecoverySession() {
          try {
            const recoveryStorageKey = `${storageKey}:recovery`;
            const params = new URLSearchParams(window.parent.location.hash.slice(1));
            if (params.get("type") === "recovery") {
              const accessToken = params.get("access_token") || "";
              const refreshToken = params.get("refresh_token") || "";
              if (accessToken && refreshToken) {
                const explicitExpiry = Number(params.get("expires_at") || 0);
                const expiresIn = Number(params.get("expires_in") || 0);
                const recoverySession = {
                  access_token: accessToken,
                  refresh_token: refreshToken,
                  expires_at: explicitExpiry || Math.floor(Date.now() / 1000) + expiresIn,
                };
                window.sessionStorage.setItem(
                  recoveryStorageKey,
                  JSON.stringify(recoverySession),
                );
                return recoverySession;
              }
            }
            const cached = window.sessionStorage.getItem(recoveryStorageKey);
            if (!cached) return null;
            const recoverySession = JSON.parse(cached);
            return recoverySession && typeof recoverySession === "object"
              ? recoverySession
              : null;
          } catch (_) {
            return null;
          }
        }

        function reply(args) {
          const readStartedAt = iframePerformanceNow();
          const recoverySession = args.recoveryRequested ? readRecoverySession() : null;
          const session = recoverySession || (args.recoveryRequested ? null : readSession());
          if (recoverySession) {
            try {
              window.sessionStorage.removeItem(storageKey);
              window.parent.history.replaceState(
                window.parent.history.state,
                "",
                `${window.parent.location.pathname}${window.parent.location.search}`,
              );
              window.top.postMessage({type: "costerly:recovery-fragment-consumed"}, "*");
            } catch (_) {}
          }
          startupPhase(args, "auth_storage_read", {
            storage_present: Boolean(session),
            storage_read_ms: Math.max(
              0,
              Number(iframePerformanceNow() || 0) - Number(readStartedAt || 0),
            ),
          });
          const value = JSON.stringify({
            status: "ready",
            requestId: args.requestId || "",
            session,
            recovery: Boolean(recoverySession),
          });
          if (value === lastValue) return;
          lastValue = value;
          send("streamlit:setComponentValue", {value});
          startupPhase(args, "auth_value_sent");
        }

        window.addEventListener("message", (event) => {
          const message = event.data || {};
          if (message.type !== "streamlit:render") return;
          const args = message.args || {};
          startupPhase(args, "auth_component_script", {
            component_script_evaluated_ms: componentScriptEvaluatedAt,
          });
          startupPhase(args, "auth_component_render", iframeNavigationTiming());
          try {
            if (args.action === "store" && args.session) {
              window.sessionStorage.setItem(storageKey, JSON.stringify(args.session));
              storeResumeCookie(args.resumeBlob);
            } else if (args.action === "clear") {
              window.sessionStorage.removeItem(storageKey);
              window.sessionStorage.removeItem(`${storageKey}:recovery`);
              clearResumeCookie();
            }
          } catch (_) {
            // Storage failure falls back to the normal sign-in screen.
          }
          if (args.action === "read") {
            reply(args);
          }
          send("streamlit:setFrameHeight", {height: 0});
        });

        send("streamlit:componentReady", {apiVersion: 1});
        send("streamlit:setFrameHeight", {height: 0});
      })();
    </script>
  </body>
</html>
